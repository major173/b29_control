# ============================================================================
# GP11 Reach 部署配置 — 仿真与实机
# ----------------------------------------------------------------------------
# 文件分两段：
#   [runtime]  训练锁定常量。源自 sim2sim_mujoco/gp11_reach_runtime.py 的
#              RUNTIME_* 常量。手改前确认与训练代码一致，否则推理会偏。
#   [deploy]   部署侧可调参数。话题名、频率、ONNX 路径、安全限幅。
# ============================================================================

runtime:
  # 任务侧
  anchor_side: "left"             # "right" / "left"，必须与 launch anchor_side 参数一致
  active_dof_names: # 关节顺序，用 name 查询，绝不靠下标
    - left_first_leg_joint
    - left_second_leg_joint
    - right_first_leg_joint
    - right_second_leg_joint

  # 时序（来自 RUNTIME_SIM_DT / RUNTIME_CONTROL_DECIMATION）
  sim_dt: 0.001                   # MuJoCo 单步
  control_decimation: 20          # 50Hz 控制 = 1/(0.001*20)

  # 关节硬限位（来自 RUNTIME_HARD_LOWER/UPPER；与 GP11_HARD_DOF_LIMITS 一致）
  hard_lower: [ -1.1, -4.71238898, -1.1, -4.71238898 ]
  hard_upper: [ 1.1,  4.71238898,  1.1,  4.71238898 ]

  # 归一化分母（来自 RUNTIME_VELOCITY_LIMITS / EFFORT_LIMITS）
  velocity_limits: [ 4.0, 4.0, 4.0, 4.0 ]
  effort_limits: [ 60.0, 45.0, 60.0, 45.0 ]

  # PD 增益（来自 RUNTIME_STIFFNESS / DAMPING）
  stiffness: [ 200.0, 200.0, 200.0, 200.0 ]
  damping: [ 60.0, 60.0, 60.0, 30.0 ]

  # DLS 全局规划的工作范围（来自训练目标采样范围）
  sample_lower: [ -0.95, -3.4906585, -0.95, -3.4906585 ]
  sample_upper: [ 0.95,  3.4906585,  0.95,  3.4906585 ]

  # 观测/动作裁剪（来自 RUNTIME_CLIP_OBSERVATIONS / ACTIONS）
  clip_observations: 100.0
  clip_actions: 1.0

  # 目标采样
  goal_refresh_interval_s: 5.0

deploy:
  # Reach 控制后端："dls"（当前部署默认）或 "onnx"（保留原网络路径）
  mode: "dls"
  # 显式选择安全参数组："gazebo" 或 "hardware"；不会自动猜测
  platform: "gazebo"

  # ONNX 模型
  onnx_model_path: ""  # 留空时由节点自动查找同包 models/reach/stage0.onnx；或填绝对路径

  # 控制频率（仿真与实机统一）
  control_rate_hz: 50.0

  # 话题：仿真节点和实机执行器都按此约定
  topics:
    joint_states: "/joint_states"                  # sensor_msgs/JointState
    target_point: "/gp11/rl/target_point_local"    # Float64MultiArray, 3D
    joint_targets: "/gp11/rl/joint_targets"         # Float64MultiArray, 4D（限幅后）
    joint_targets_raw: "/gp11/rl/joint_targets_raw"   # Float64MultiArray, 4D（限幅前，调试）
    observation: "/gp11/rl/observation"           # Float64MultiArray, 28D（调试）
    action_raw: "/gp11/rl/action_raw"            # Float64MultiArray, 4D（调试）

  # 安全限幅参数组；旧版单个 safety 块仍可由加载器兼容
  safety_profiles:
    gazebo:
      enable: true
      max_joint_vel: 4.0
      target_step_clip: 1.00    # |q_target-q_measured| 上限 (rad)
      deadman_required: false
    hardware:
      enable: true
      max_joint_vel: 0.10
      target_step_clip: 0.50    # 实机首轮联调值，验证后逐级放开
      deadman_required: false

  # DLS 控制器。局部计算 25Hz，目标发布仍为 50Hz。
  dls:
    control_rate_hz: 25.0
    position_gain: 4.0
    orientation_gain: 1.5
    orientation_weight: 0.08
    damping: 0.08
    jacobian_epsilon: 0.0001
    max_position_error: 0.60
    max_orientation_error: 1.0
    joint_limit_margin: 0.05
    limit_avoidance_distance: 0.05
    limit_avoidance_gain: 0.04
    max_target_lead_fraction: 0.80
    joint_plan_gain: 2.0
    joint_plan_blend_distance: 0.15
    velocity_damping: 0.35
    project_changed_goals: true
    relative_axis_start_body: null

  # DLS 实机故障监测。故障后冻结最后安全目标，需重启节点复位。
  watchdog:
    feedback_timeout_s: 0.10
    track_error_rad: 0.20
    track_error_persist_s: 0.20
    dq_limit_rad_s: 2.0
    dq_persist_s: 0.30

  # 观测预处理（Gazebo 速度有限差分噪声，需低通滤波）
  obs_filter:
    dq_alpha: 1.0               # 速度低通系数 [0,1]，1.0=不滤波（直通）
    # 2026-07-26 定标（RL 仓库 docs/delay/01 测试 F）：实机 dq 无测量噪声，
    # α=0.2 使策略仅看到 29% 的震荡 dq 幅值且 @6.63Hz 额外滞后 52°，故移除。
    # 若 Gazebo 有限差分噪声确需滤波，单独评估后再改，且勿低于 0.8。

  # MuJoCo 仿真（仅 mujoco_sim_node 使用）
  mujoco:
    runtime_dir: "sim2sim_mujoco/gp11_description/runtime"  # urdf 解包目录
    seed: 0
    publish_target_point: true   # 由仿真自动采样目标点并广播；false 时等待外部话题
