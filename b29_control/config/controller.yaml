b29_controller:
  # Publish all joint states -----------------------------------
  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 50

  robot_state_controller:
    type: robot_state_controller/RobotStateController
    publish_rate: 100

  imu_sensor_controller:
    type: imu_sensor_controller/ImuSensorController
    publish_rate: 50

  b29_smc_auto_controller:
    type: b29_smc_auto_controller/B29SmcAutoController
    publish_rate: 50
    posture_roll_limit: 0.035
    posture_pitch_limit: 0.035
    joint_names:
      left_first_leg_joint: "left_first_leg_joint"
      left_second_leg_joint: "left_second_leg_joint"
      l_gripper_left_drive_joint: "l_gripper_left_drive_joint"
      right_first_leg_joint: "right_first_leg_joint"
      right_second_leg_joint: "right_second_leg_joint"
      r_gripper_left_drive_joint: "r_gripper_left_drive_joint"
      left_friction_wheel_joint: "left_friction_wheel_joint"
      right_friction_wheel_joint: "right_friction_wheel_joint"
    imu_names: "base_imu"
    auto_state_name: "auto_state"
    use_sensor_input: false
    use_auto_state: true
    debug_validation:
      enabled: true
      simulation_only: false
    planner_control:
      manual_release_enabled: true
    output_mode: "normal" # "normal", "safe_hold"
    planner_input:
      enabled: true
      topic: "planner_joint_point"
      point_timeout: 1.0
      max_delta_per_cycle: 0.10
    robot_motion:
      wait_for_planner_point_control_time: 10.0
      wait_for_grip_respond_time: 5.0
      disconnect_cable_step_motion_duration: 3.0
      disconnect_cable_step_interval: 0.5
      succeed_disconnect_cable_threshold: 0.17
      disconnect_cable_second_joint_check_delta: 0.20
      close_gripper_retry_limit: 2
      disconnect_cable_retry_limit: 2
      planner_regrip_retry_limit: 2
      disconnect_cable_up_joint_position: 0.5
      disconnect_cable_down_joint_position: 0.5
      disconnect_cable_move_joint_position: 0.5


