# 执行器辨识激励协议与安全配置（actuator_id_node.py）
# 文档：docs/actuator-id.md；RL 仓库对应分析：sim2deploy/tools/fit_actuator_id.py

topics:
  joint_states: "/joint_states"
  controller_ns: "/b29_controller"        # <joint>_position_controller/command

joints:                                    # 激励顺序（minimal 模式只跑带 * 的）
  - left_first_leg_joint
  - left_second_leg_joint                  # *
  - right_first_leg_joint
  - right_second_leg_joint                 # *
minimal_joints:
  - left_second_leg_joint
  - right_second_leg_joint

# 起始位姿："current" = 启动时以实际位姿为基准（最安全）；或给 4 个显式弧度值
start_pose: current

runtime:
  control_rate_hz: 50.0
  hard_lower: [ -1.1, -4.71238898, -1.1, -4.71238898 ]
  hard_upper: [ 1.1,  4.71238898,  1.1,  4.71238898 ]
  limit_margin: 0.15                       # 规划轨迹距硬限位的最小余量 (rad)

protocol:
  step:                                    # 测试 B：阶跃组
    amplitudes: [0.03, 0.08]               # rad，从小到大
    directions: [1, -1]
    reps: 5
    settle_s: 2.0                          # 每次阶跃前的静置
    hold_s: 3.0                            # 阶跃后保持
  sweep:                                   # 测试 C：扫频组
    amplitude: 0.03                        # rad
    freqs_hz: [0.2, 0.3, 0.5, 0.8, 1.2, 1.86, 2.5, 3.5, 5.0, 6.6, 8.0]
    cycles_low: 6                          # f < 1 Hz 的周期数
    cycles_high: 10                        # f >= 1 Hz 的周期数
    high_freq_confirm_hz: 3.0              # 高于此频率的组需要单独人工确认

safety:
  feedback_timeout_s: 0.10                 # /joint_states 断流即安全停
  track_err_rad: 0.20                      # |q_cmd - q| 超过
  track_err_persist_s: 0.20                #   并持续该时长 → 安全停
  dq_limit_rad_s: 2.0                      # 小幅激励下速度异常（疯机/自激检测）
  dq_persist_s: 0.30
  # 力矩瞬时超限 → 安全停。单位必须与 /joint_states 的 effort 字段一致——先
  # `rostopic echo -n1 /joint_states` 确认实机上报的是 N·m、电流还是原始计数；
  # 不确定时把阈值设很大（如 1.0e9）等效停用该层，其余三层保护不受影响。
  tau_limits: [ 60.0, 45.0, 60.0, 45.0 ]
  loop_overrun_s: 0.10                     # 自身控制循环卡顿则跳过本拍
  safe_stop_publish_s: 3.0                 # 安全停时持续重发安全位姿的时长

output:
  dir: "~/actuator_id_runs"                # 每次 session 建带时间戳子目录
  record_bag: true
  bag_topics:
    - "/joint_states"
    - "/b29_controller/left_first_leg_joint_position_controller/command"
    - "/b29_controller/left_second_leg_joint_position_controller/command"
    - "/b29_controller/right_first_leg_joint_position_controller/command"
    - "/b29_controller/right_second_leg_joint_position_controller/command"
